<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>AgentScholar architecture: a topic flows through Search, Read, Write and Review agents to produce a report and a critic score</title>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1000" height="470" rx="18" fill="#0b0d17"/>
  <text x="500" y="40" text-anchor="middle" fill="#e7e9f4" font-size="20" font-weight="700">How AgentScholar works</text>

  <!-- input -->
  <rect x="30" y="150" width="120" height="64" rx="12" fill="#151827" stroke="#334155"/>
  <text x="90" y="178" text-anchor="middle" fill="#e7e9f4" font-size="14" font-weight="700">Your topic</text>
  <text x="90" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">Streamlit UI / CLI</text>

  <!-- pipeline frame -->
  <rect x="180" y="90" width="640" height="190" rx="16" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="196" y="114" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">AGENT PIPELINE · LangChain</text>

  <!-- agents -->
  <g font-size="12">
    <rect x="200" y="135" width="135" height="95" rx="12" fill="#151827" stroke="#8b5cf6"/>
    <text x="267" y="163" text-anchor="middle" fill="#e7e9f4" font-size="15" font-weight="700">1 · Search</text>
    <text x="267" y="185" text-anchor="middle" fill="#94a3b8">Tool-calling agent</text>
    <text x="267" y="203" text-anchor="middle" fill="#94a3b8">finds fresh sources</text>

    <rect x="355" y="135" width="135" height="95" rx="12" fill="#151827" stroke="#7c8cf8"/>
    <text x="422" y="163" text-anchor="middle" fill="#e7e9f4" font-size="15" font-weight="700">2 · Read</text>
    <text x="422" y="185" text-anchor="middle" fill="#94a3b8">Tool-calling agent</text>
    <text x="422" y="203" text-anchor="middle" fill="#94a3b8">scrapes best page</text>

    <rect x="510" y="135" width="135" height="95" rx="12" fill="#151827" stroke="#4fa8f0"/>
    <text x="577" y="163" text-anchor="middle" fill="#e7e9f4" font-size="15" font-weight="700">3 · Write</text>
    <text x="577" y="185" text-anchor="middle" fill="#94a3b8">LLM chain drafts</text>
    <text x="577" y="203" text-anchor="middle" fill="#94a3b8">a cited report</text>

    <rect x="665" y="135" width="135" height="95" rx="12" fill="#151827" stroke="#22d3ee"/>
    <text x="732" y="163" text-anchor="middle" fill="#e7e9f4" font-size="15" font-weight="700">4 · Review</text>
    <text x="732" y="185" text-anchor="middle" fill="#94a3b8">Critic chain scores</text>
    <text x="732" y="203" text-anchor="middle" fill="#94a3b8">and gives feedback</text>
  </g>
  <g stroke="#a5b4fc" stroke-width="2" marker-end="url(#a)">
    <line x1="150" y1="182" x2="196" y2="182"/>
    <line x1="335" y1="182" x2="351" y2="182"/>
    <line x1="490" y1="182" x2="506" y2="182"/>
    <line x1="645" y1="182" x2="661" y2="182"/>
    <line x1="800" y1="182" x2="846" y2="182"/>
  </g>

  <!-- outputs -->
  <rect x="850" y="132" width="125" height="100" rx="12" fill="#151827" stroke="#334155"/>
  <text x="912" y="160" text-anchor="middle" fill="#e7e9f4" font-size="14" font-weight="700">Results</text>
  <text x="912" y="182" text-anchor="middle" fill="#94a3b8" font-size="11">Markdown report</text>
  <text x="912" y="199" text-anchor="middle" fill="#94a3b8" font-size="11">Score out of 10</text>
  <text x="912" y="216" text-anchor="middle" fill="#94a3b8" font-size="11">Source list</text>

  <!-- external services -->
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#d)">
    <line x1="267" y1="230" x2="267" y2="356"/>
    <line x1="422" y1="230" x2="422" y2="356"/>
    <line x1="577" y1="230" x2="577" y2="306"/>
    <line x1="732" y1="230" x2="732" y2="306"/>
  </g>
  <rect x="510" y="310" width="290" height="44" rx="10" fill="#1a1530" stroke="#8b5cf6"/>
  <text x="655" y="337" text-anchor="middle" fill="#e7e9f4" font-size="13" font-weight="600">OpenAI gpt-5-mini (all four agents)</text>
  <rect x="200" y="360" width="135" height="58" rx="10" fill="#0f1f27" stroke="#22d3ee"/>
  <text x="267" y="385" text-anchor="middle" fill="#e7e9f4" font-size="13" font-weight="600">Tavily API</text>
  <text x="267" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">live web search</text>
  <rect x="355" y="360" width="135" height="58" rx="10" fill="#0f1f27" stroke="#22d3ee"/>
  <text x="422" y="385" text-anchor="middle" fill="#e7e9f4" font-size="13" font-weight="600">Source website</text>
  <text x="422" y="404" text-anchor="middle" fill="#94a3b8" font-size="11">requests + BeautifulSoup</text>

  <text x="500" y="452" text-anchor="middle" fill="#64748b" font-size="11">Solid arrows: data passed between agents · Dashed arrows: external APIs each agent calls</text>
</svg>
